:root{

/* One compact system for the stadium LED board. */
.stadium-board.board-v5{
  width:auto!important;
  height:clamp(50px,6.1dvh,62px)!important;
  min-height:50px!important;
  max-height:62px!important;
  aspect-ratio:auto!important;
  margin:5px 8px 0!important;
  border:1px solid rgba(134,209,255,.20)!important;
  border-bottom-color:rgba(0,8,28,.88)!important;
  border-radius:7px 7px 0 0!important;
  background:
    linear-gradient(180deg,rgba(255,255,255,.045),transparent 35%),
    linear-gradient(90deg,#071b49,#0b2c70 48%,#071b49)!important;
  box-shadow:0 3px 0 #04122f,0 6px 14px rgba(0,8,35,.34)!important;
  display:grid!important;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)!important;
  align-items:center!important;
  gap:8px!important;
  padding:5px 10px!important;
  overflow:hidden!important;
  position:relative!important;
}
.stadium-board.board-v5:before{
  content:&#x27;&#x27;;position:absolute;inset:0;pointer-events:none;opacity:.18;
  background:repeating-linear-gradient(90deg,transparent 0 31px,rgba(255,255,255,.07) 31px 32px);
}
.stadium-board.board-v5:after{
  content:&#x27;&#x27;;position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 26%,transparent 78%,rgba(0,0,0,.18));
